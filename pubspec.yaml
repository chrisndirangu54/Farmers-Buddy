name: farmers_buddy
description: AI, satellite and IoT powered farm monitoring and automation platform.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  firebase_storage: ^12.3.3
  flutter_riverpod: ^2.6.1
  go_router: ^14.3.0
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  http: ^1.2.2
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
